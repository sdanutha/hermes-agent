name: Core Runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pm
      - name: Prepare test environment
        run: python -m pm.build_env --source . --out .venv --extra runtime --group dev --group test
      - name: Validate core behavior
        run: |
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            tests/test_hermes_core.py tests/tools/test_core_extensions.py \
            tests/pm/test_core_runtime_selection.py tests/tools/test_skills_tool.py \
            tests/tools/test_mcp_tool.py tests/hermes_cli/test_plugins.py \
            tests/gateway/test_profile_isolation_runtime.py
      - run: python scripts/check
