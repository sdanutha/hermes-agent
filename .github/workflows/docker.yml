name: Core Docker smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - run: docker build -t hermes-core:test .
      - name: Start without UI or provider credentials
        run: |
          docker run -d --name hermes-core-smoke hermes-core:test
          for attempt in $(seq 1 90); do
            if docker exec hermes-core-smoke python -m hermes_core health; then exit 0; fi
            sleep 2
          done
          docker logs hermes-core-smoke
          exit 1
      - name: Verify runtime user and stop
        if: always()
        run: |
          test "$(docker exec hermes-core-smoke id -u)" = 10000
          docker stop --time 90 hermes-core-smoke
          docker logs hermes-core-smoke
