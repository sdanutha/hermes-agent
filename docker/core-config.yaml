# Provider credentials and API_SERVER_KEY come from runtime secrets, never this file.
model:
  provider: openrouter
  default: your-provider-model
terminal:
  backend: local
  cwd: /workspace
gateway:
  multiplex_profiles: false
platforms:
  api_server:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8642
