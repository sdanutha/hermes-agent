services:
  hermes-core:
    build: .
    image: hermes-core:local
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes-state:/var/lib/hermes
      - hermes-workspace:/workspace
      - ./docker/core-config.yaml:/var/lib/hermes/config.yaml:ro
    # Mount additional skills/plugins beneath /var/lib/hermes/skills or plugins.
    # No privileged mode, host filesystem access, or Docker socket is required.
volumes:
  hermes-state:
  hermes-workspace:
